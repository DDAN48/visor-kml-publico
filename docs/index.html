<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mapa de avance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --panel-bg: rgba(255, 255, 255, 0.96);
      --blue: #2563eb;
      --green: #2e7d32;
      --orange: #ef6c00;
      --red: #d64d4e;
      --purple: #6a1b9a;
      --shadow: 0 8px 28px rgba(15, 23, 42, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .panel {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      width: clamp(420px, 43vw, 760px);
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      padding: clamp(14px, 1.2vw, 24px);
      border-radius: 18px;
      background: var(--panel-bg);
      box-shadow: var(--shadow);
      font-size: clamp(12px, 0.85vw, 15px);
      backdrop-filter: blur(4px);
    }

    .panel::-webkit-scrollbar {
      width: 8px;
    }

    .panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .panel::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.45);
      border-radius: 999px;
    }

    .panel::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.7);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel h2 {
      margin: 0;
      font-size: clamp(22px, 2vw, 34px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .fecha {
      color: var(--muted);
      font-size: clamp(11px, 0.8vw, 14px);
      margin-top: 8px;
    }

    .nota-unidad {
      font-size: clamp(10px, 0.75vw, 13px);
      font-weight: 700;
      color: var(--text);
      margin-top: 4px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      min-width: clamp(78px, 6.5vw, 120px);
      padding: clamp(8px, 0.8vw, 14px);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      font-size: clamp(10px, 0.75vw, 13px);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
      color: var(--text);
    }

    .action-btn:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .action-icon {
      display: block;
      font-size: 18px;
      line-height: 1;
      margin-bottom: 4px;
    }

    .card-section {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: clamp(12px, 1vw, 20px);
      margin-bottom: clamp(10px, 1vw, 16px);
      background: rgba(255, 255, 255, 0.92);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(16px, 1.35vw, 24px);
      font-weight: 800;
      margin-bottom: 14px;
      cursor: pointer;
      user-select: none;
    }

    .chevron {
      font-size: clamp(12px, 1vw, 16px);
      color: #0066cc;
      width: 18px;
      text-align: center;
      flex: 0 0 auto;
    }

    .section-body.collapsed {
      display: none;
    }

    .month-tabs-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0 16px 0;
      flex-wrap: wrap;
    }

    .month-tabs-label {
      font-weight: 800;
      margin-right: 4px;
      display: flex;
      align-items: center;
    }

    .month-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .month-tab {
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 10px;
      padding: clamp(7px, 0.7vw, 11px) clamp(14px, 1.4vw, 24px);
      font-size: clamp(12px, 0.9vw, 16px);
      font-weight: 800;
      cursor: pointer;
      color: var(--text);
    }

    .month-tab.active {
      border-color: var(--blue);
      color: var(--blue);
      box-shadow: inset 0 -2px 0 var(--blue);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 0.9vw, 16px);
    }

    .summary-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: clamp(10px, 1vw, 18px);
      text-align: center;
      background: #ffffff;
      min-height: auto;
    }

    .summary-label {
      font-size: clamp(11px, 0.8vw, 14px);
      font-weight: 800;
      color: #374151;
      line-height: 1.15;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .summary-value {
      margin-top: 8px;
      font-size: clamp(24px, 2.2vw, 40px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .summary-percent {
      margin-top: 6px;
      font-size: clamp(11px, 0.8vw, 14px);
      font-weight: 800;
      color: var(--muted);
    }

    .value-blue { color: var(--blue); }
    .value-green { color: var(--green); }
    .value-orange { color: var(--orange); }

    .subsection-title {
      font-size: clamp(13px, 0.95vw, 16px);
      font-weight: 800;
      margin: 12px 0 8px;
    }

    .layer-list {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: #ffffff;
    }

    .layer-row {
      display: grid;
      grid-template-columns: auto auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #f1f5f9;
      font-size: clamp(12px, 0.85vw, 14px);
    }

    .layer-row:last-child {
      border-bottom: none;
    }

    .layer-row input[type="checkbox"] {
      margin: 0;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .color-box {
      width: 14px;
      height: 14px;
      border: 1px solid rgba(17, 24, 39, 0.35);
      border-radius: 2px;
      flex: 0 0 auto;
    }

    .layer-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric-pill {
      padding: 2px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #ffffff;
      font-size: clamp(11px, 0.78vw, 13px);
      font-weight: 800;
      color: var(--muted);
      white-space: nowrap;
    }

    .metric-pill.blue { color: var(--blue); border-color: rgba(37, 99, 235, 0.25); }
    .metric-pill.green { color: var(--green); border-color: rgba(46, 125, 50, 0.25); }
    .metric-pill.orange { color: var(--orange); border-color: rgba(239, 108, 0, 0.25); }
    .metric-pill.red { color: var(--red); border-color: rgba(214, 77, 78, 0.25); }
    .metric-pill.purple { color: var(--purple); border-color: rgba(106, 27, 154, 0.25); }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .leaflet-popup-content {
      font-size: 13px;
    }

    @media (max-width: 1500px) {
      .panel {
        width: clamp(420px, 46vw, 620px);
        padding: 16px;
        border-radius: 16px;
      }

      .panel h2 {
        font-size: 28px;
      }

      .summary-value {
        font-size: 30px;
      }

      .summary-card {
        padding: 12px;
      }

      .section-header {
        font-size: 20px;
      }
    }

    @media (max-width: 1100px) {
      .panel {
        width: calc(100vw - 32px);
        left: 16px;
        right: 16px;
        top: 16px;
        max-height: 55vh;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .panel-header {
        flex-direction: column;
      }

      .top-actions {
        width: 100%;
      }

      .action-btn {
        flex: 1;
      }
    }

    @media (max-width: 700px) {
      .panel {
        top: auto;
        left: 8px;
        right: 8px;
        bottom: 8px;
        width: auto;
        max-width: none;
        max-height: 58vh;
        padding: 12px;
        border-radius: 16px;
      }

      .panel h2 {
        font-size: 22px;
      }

      .fecha,
      .nota-unidad {
        font-size: 11px;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .summary-value {
        font-size: 24px;
      }

      .summary-label {
        font-size: 11px;
      }

      .month-tabs {
        gap: 6px;
      }

      .month-tab {
        padding: 7px 12px;
        font-size: 12px;
      }

      .card-section {
        padding: 10px;
        border-radius: 14px;
      }

      .section-header {
        font-size: 17px;
      }

      .layer-row {
        grid-template-columns: auto auto minmax(0, 1fr) auto;
      }

      .layer-row .metric-pill.percent-pill {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <div class="panel-header">
      <div>
        <h2>Mapa de avance</h2>
        <div id="fecha" class="fecha">Cargando capas...</div>
        <div class="nota-unidad">*Unidades están expresadas en manzanas</div>
      </div>

      <div class="top-actions">
        <button id="btnMostrarTodo" class="action-btn" type="button">
          <span class="action-icon">◉</span>
          Mostrar todo
        </button>
        <button id="btnOcultarTodo" class="action-btn" type="button">
          <span class="action-icon">○</span>
          Ocultar todo
        </button>
      </div>
    </div>

    <div id="panelContent"></div>
  </div>

  <script>
    const map = L.map("map").setView([-34.65, -58.55], 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const layerObjects = {};
    const layerInfoById = {};
    const loadedBounds = [];

    let manifestGlobal = null;
    let resumenGlobal = null;
    let activeResumenKey = null;
    let activePlanMesId = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizarTexto(value) {
      return String(value ?? "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ");
    }

    function formatNumber(value) {
      const num = Number(value || 0);
      return new Intl.NumberFormat("es-AR", {
        maximumFractionDigits: 2,
        minimumFractionDigits: Number.isInteger(num) ? 0 : 2
      }).format(num);
    }

    function formatPercent(value) {
      const num = Number(value || 0);
      return new Intl.NumberFormat("es-AR", {
        maximumFractionDigits: 1,
        minimumFractionDigits: 0
      }).format(num) + "%";
    }

    function getMesesConfig() {
      return (resumenGlobal?.meses_config || [])
        .slice()
        .sort((a, b) => Number(a.orden || 0) - Number(b.orden || 0));
    }

    function getMesConfigById(mesId) {
      return getMesesConfig().find(m => m.mes_id === mesId);
    }

    function colorClassByTipo(tipo) {
      if (tipo === "tendido_finalizado") return "green";
      if (tipo === "columna_finalizada") return "blue";
      if (tipo === "estado_finalizado") return "orange";
      if (tipo === "semana") return "red";
      if (tipo === "zonas_aph") return "purple";
      return "blue";
    }

    function popupContent(feature) {
      const p = feature.properties || {};

      return `
        <strong>${escapeHtml(p.name || "Bloque")}</strong><br>
        <br>
        <strong>Grupo:</strong> ${escapeHtml(p.grupo || "")}<br>
        <strong>Tipo:</strong> ${escapeHtml(p.tipo_salida || "")}<br>
        <strong>Mes:</strong> ${escapeHtml(p.mes_label || "")}<br>
        <strong>Manzanas:</strong> ${escapeHtml(formatNumber(p.manzanas || 0))}<br>
        <strong>Avance:</strong> ${escapeHtml(formatPercent(p.porcentaje || 0))}<br>
        <strong>Bloque:</strong> ${escapeHtml(p.bloque || "")}<br>
        <br>
        ${escapeHtml(p.descripcion || "")}
      `;
    }

    function styleFeature(feature) {
      const color = feature?.properties?.color || "#008000";
      const tipo = feature?.properties?.tipo_salida || feature?.properties?.type || "";

      if (tipo === "zonas_aph") {
        return {
          color,
          weight: 2,
          fillColor: color,
          fillOpacity: 0.08,
          dashArray: "6, 4"
        };
      }

      if (tipo === "semana") {
        return {
          color,
          weight: 1.5,
          fillColor: color,
          fillOpacity: 0.13
        };
      }

      return {
        color,
        weight: 1.6,
        fillColor: color,
        fillOpacity: 0.20
      };
    }

    function makeLayerKey(layerInfo) {
      return layerInfo.layer_id || layerInfo.kml || layerInfo.name;
    }

    async function loadLayer(layerInfo) {
      const response = await fetch(layerInfo.geojson_file + "?v=" + Date.now());

      if (!response.ok) {
        throw new Error("No se pudo cargar " + layerInfo.geojson_file);
      }

      const geojson = await response.json();

      const layer = L.geoJSON(geojson, {
        style: styleFeature,
        onEachFeature: function(feature, lyr) {
          lyr.bindPopup(popupContent(feature));
        }
      });

      const key = makeLayerKey(layerInfo);
      layerObjects[key] = layer;
      layerInfoById[key] = layerInfo;

      try {
        const bounds = layer.getBounds();
        if (bounds.isValid() && layerInfo.type !== "zonas_aph") {
          loadedBounds.push(bounds);
        }
      } catch (e) {
        console.warn("No se pudo calcular bounds para", layerInfo.name);
      }

      return layer;
    }

    function addLayerByKey(key) {
      const layer = layerObjects[key];
      if (layer && !map.hasLayer(layer)) {
        layer.addTo(map);
      }
    }

    function removeLayerByKey(key) {
      const layer = layerObjects[key];
      if (layer && map.hasLayer(layer)) {
        map.removeLayer(layer);
      }
    }

    function removeAllLayers() {
      Object.keys(layerObjects).forEach(removeLayerByKey);
    }

    function getCapas() {
      return resumenGlobal?.capas || [];
    }

    function getCapasByMes(mesId) {
      return getCapas().filter(c => c.mes_id === mesId);
    }

    function getCapasFinalizadasByMes(mesId) {
      return getCapasByMes(mesId).filter(c => c.grupo === "tareas_finalizadas");
    }

    function getCapasSemanaByMes(mesId) {
      return getCapasByMes(mesId).filter(c => c.grupo === "semana_inicio");
    }

    function getLayerKeyFromCapa(capa) {
      return capa.layer_id || capa.kml || capa.nombre;
    }

    function setCheckboxCheckedForKey(key, checked) {
      const checkbox = document.querySelector(`[data-layer-key="${CSS.escape(key)}"]`);
      if (checkbox) checkbox.checked = checked;
    }

    function syncCheckboxesWithMap() {
      Object.keys(layerObjects).forEach(key => {
        const layer = layerObjects[key];
        setCheckboxCheckedForKey(key, map.hasLayer(layer));
      });
    }

    function showOnlyResumenSelection() {
      removeAllLayers();

      if (activeResumenKey === "total") {
        getCapas()
          .filter(c => c.grupo === "tareas_finalizadas")
          .forEach(c => addLayerByKey(getLayerKeyFromCapa(c)));
      } else {
        getCapasFinalizadasByMes(activeResumenKey)
          .forEach(c => addLayerByKey(getLayerKeyFromCapa(c)));
      }

      syncCheckboxesWithMap();
    }

    function toggleSection(sectionId) {
      const body = document.getElementById(sectionId + "Body");
      const chev = document.getElementById(sectionId + "Chevron");
      if (!body || !chev) return;

      body.classList.toggle("collapsed");
      chev.textContent = body.classList.contains("collapsed") ? ">" : "v";
    }

    function createSection(id, title, initiallyOpen, contentHtml) {
      return `
        <section class="card-section">
          <div class="section-header" onclick="toggleSection('${id}')">
            <span id="${id}Chevron" class="chevron">${initiallyOpen ? "v" : ">"}</span>
            <span>${escapeHtml(title)}</span>
          </div>
          <div id="${id}Body" class="section-body ${initiallyOpen ? "" : "collapsed"}">
            ${contentHtml}
          </div>
        </section>
      `;
    }

    function renderMonthTabs(target, activeKey, includeTotal, onClickName) {
      const meses = getMesesConfig();
      let html = `<div class="month-tabs-wrap"><span class="month-tabs-label">Mes</span><div class="month-tabs">`;

      if (includeTotal) {
        html += `
          <button type="button" class="month-tab ${activeKey === "total" ? "active" : ""}" onclick="${onClickName}('total')">
            Total
          </button>
        `;
      }

      meses.forEach(m => {
        const label = m.mes_label || m.tab_label || m.mes_id;
        html += `
          <button type="button" class="month-tab ${activeKey === m.mes_id ? "active" : ""}" onclick="${onClickName}('${m.mes_id}')">
            ${escapeHtml(label)}
          </button>
        `;
      });

      html += `</div></div>`;
      return html;
    }

    function getResumenData(key) {
      if (key === "total") return resumenGlobal?.resumen_general || {};
      return resumenGlobal?.resumen_por_mes?.[key] || {};
    }

    function getMetric(metricObj) {
      if (typeof metricObj === "number") {
        return { manzanas: metricObj, porcentaje: 0 };
      }
      return {
        manzanas: Number(metricObj?.manzanas || 0),
        porcentaje: Number(metricObj?.porcentaje || 0)
      };
    }

    function renderSummaryCards(key) {
      const data = getResumenData(key);
      const planificado = getMetric(data.planificado);
      const tendido = getMetric(data.tendido_finalizado);
      const columna = getMetric(data.columna_finalizada);
      const estado = getMetric(data.estado_finalizado);

      const cards = [
        { label: "Planificado", metric: planificado, cls: "value-blue" },
        { label: "Tendido<br>finalizado", metric: tendido, cls: "value-green" },
        { label: "Columna<br>finalizada", metric: columna, cls: "value-blue" },
        { label: "Estado<br>finalizado", metric: estado, cls: "value-orange" }
      ];

      return `
        <div class="summary-grid">
          ${cards.map(c => `
            <div class="summary-card">
              <div class="summary-label">${c.label}</div>
              <div class="summary-value ${c.cls}">${formatNumber(c.metric.manzanas)}</div>
              <div class="summary-percent">${formatPercent(c.metric.porcentaje)}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderResumenGeneral() {
      const content = `
        <div id="resumenTabs">
          ${renderMonthTabs("resumen", activeResumenKey, true, "selectResumen")}
        </div>
        <div id="summaryCards">
          ${renderSummaryCards(activeResumenKey)}
        </div>
      `;

      return createSection("resumenGeneral", "Resumen general", true, content);
    }

    function renderLayerRows(capas, showPercent = true) {
      if (!capas.length) {
        return `<div class="layer-list"><div class="layer-row">Sin capas para este mes</div></div>`;
      }

      return `
        <div class="layer-list">
          ${capas.map(capa => {
            const key = getLayerKeyFromCapa(capa);
            const color = capa.color || "#757575";
            const colorCls = colorClassByTipo(capa.tipo);
            const isDefaultChecked = false;
            return `
              <label class="layer-row">
                <input
                  type="checkbox"
                  data-layer-key="${escapeHtml(key)}"
                  ${isDefaultChecked ? "checked" : ""}
                  onchange="toggleLayerFromCheckbox('${escapeHtml(key)}', this.checked)"
                />
                <span class="color-box" style="background:${escapeHtml(color)}"></span>
                <span class="layer-name">${escapeHtml(capa.nombre || capa.name || key)}</span>
                <span class="metric-pill ${colorCls}">${formatNumber(capa.manzanas || 0)}</span>
                ${showPercent ? `<span class="metric-pill ${colorCls} percent-pill">${formatPercent(capa.porcentaje || 0)}</span>` : ""}
              </label>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderPlanPorMes() {
      const meses = getMesesConfig();
      if (!activePlanMesId && meses.length) activePlanMesId = meses[0].mes_id;

      const finalizadas = getCapasFinalizadasByMes(activePlanMesId);
      const semanas = getCapasSemanaByMes(activePlanMesId);

      const content = `
        <div id="planTabs">
          ${renderMonthTabs("plan", activePlanMesId, false, "selectPlanMes")}
        </div>

        <div id="planMesContent">
          <div class="subsection-title">A. Tareas Finalizadas</div>
          ${renderLayerRows(finalizadas, true)}

          <div class="subsection-title">B. Semana de Inicio</div>
          ${renderLayerRows(semanas, true)}
        </div>
      `;

      return createSection("planPorMes", "Plan por mes", false, content);
    }

    function renderZonasAph() {
      const capasAph = (manifestGlobal?.layers || []).filter(l => l.type === "zonas_aph");
      const rows = capasAph.map(l => {
        const key = makeLayerKey(l);
        return {
          layer_id: key,
          nombre: l.name || "Zonas APH",
          tipo: "zonas_aph",
          color: l.color || "#6A1B9A",
          manzanas: l.features || 0,
          porcentaje: 0
        };
      });

      const content = renderLayerRows(rows, true);
      return createSection("zonasAph", "Zonas APH", false, content);
    }

    function renderPanel() {
      const container = document.getElementById("panelContent");
      container.innerHTML = `
        ${renderResumenGeneral()}
        ${renderPlanPorMes()}
        ${renderZonasAph()}
      `;
      syncCheckboxesWithMap();
    }

    window.selectResumen = function(key) {
      activeResumenKey = key;
      document.getElementById("resumenTabs").innerHTML = renderMonthTabs("resumen", activeResumenKey, true, "selectResumen");
      document.getElementById("summaryCards").innerHTML = renderSummaryCards(activeResumenKey);
      showOnlyResumenSelection();
    };

    window.selectPlanMes = function(mesId) {
      activePlanMesId = mesId;
      const finalizadas = getCapasFinalizadasByMes(activePlanMesId);
      const semanas = getCapasSemanaByMes(activePlanMesId);

      document.getElementById("planTabs").innerHTML = renderMonthTabs("plan", activePlanMesId, false, "selectPlanMes");
      document.getElementById("planMesContent").innerHTML = `
        <div class="subsection-title">A. Tareas Finalizadas</div>
        ${renderLayerRows(finalizadas, true)}

        <div class="subsection-title">B. Semana de Inicio</div>
        ${renderLayerRows(semanas, true)}
      `;
      syncCheckboxesWithMap();
    };

    window.toggleLayerFromCheckbox = function(key, checked) {
      if (checked) {
        addLayerByKey(key);
      } else {
        removeLayerByKey(key);
      }
      syncCheckboxesWithMap();
    };

    window.toggleSection = toggleSection;

    function selectInitialMes() {
      const meses = getMesesConfig();
      if (!meses.length) return "total";

      const generated = resumenGlobal?.generated_at || manifestGlobal?.generated_at || "";
      const date = new Date(generated);

      if (!Number.isNaN(date.getTime())) {
        const monthIndex = date.getMonth();
        const monthNames = [
          "enero", "febrero", "marzo", "abril", "mayo", "junio",
          "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"
        ];
        const currentMonthName = monthNames[monthIndex];
        const match = meses.find(m => normalizarTexto(m.mes_label) === currentMonthName);
        if (match) return match.mes_id;
      }

      return meses[0].mes_id;
    }

    function setupButtons() {
      document.getElementById("btnMostrarTodo").addEventListener("click", () => {
        Object.keys(layerObjects).forEach(addLayerByKey);
        syncCheckboxesWithMap();
      });

      document.getElementById("btnOcultarTodo").addEventListener("click", () => {
        removeAllLayers();
        syncCheckboxesWithMap();
      });
    }

    async function init() {
      try {
        const manifestResponse = await fetch("data/layers.json?v=" + Date.now());

        if (!manifestResponse.ok) {
          throw new Error("No existe data/layers.json todavía. Ejecutá primero el workflow.");
        }

        manifestGlobal = await manifestResponse.json();

        const resumenResponse = await fetch("data/avance_resumen.json?v=" + Date.now());

        if (!resumenResponse.ok) {
          throw new Error("No existe data/avance_resumen.json todavía. Ejecutá primero el workflow del generador y del visor.");
        }

        resumenGlobal = await resumenResponse.json();

        document.getElementById("fecha").textContent =
          "Última actualización: " + (resumenGlobal.generated_at || manifestGlobal.generated_at || "sin fecha");

        const layers = manifestGlobal.layers || [];

        for (const layerInfo of layers) {
          await loadLayer(layerInfo);
        }

        activeResumenKey = selectInitialMes();
        activePlanMesId = activeResumenKey === "total" ? (getMesesConfig()[0]?.mes_id || null) : activeResumenKey;

        renderPanel();
        setupButtons();
        showOnlyResumenSelection();

        if (loadedBounds.length > 0) {
          let finalBounds = loadedBounds[0];

          for (let i = 1; i < loadedBounds.length; i++) {
            finalBounds.extend(loadedBounds[i]);
          }

          map.fitBounds(finalBounds, {
            padding: [20, 20]
          });
        }
      } catch (error) {
        console.error(error);
        document.getElementById("fecha").innerHTML =
          `<span class="error">${escapeHtml(error.message)}</span>`;
      }
    }

    init();
  </script>
</body>
</html>
